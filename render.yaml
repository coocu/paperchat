services:
  - type: web
    name: codenote-paper-chat
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: chat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SECRET
        generateValue: true
      - key: SUPPORT_EMAIL
        value: code_note95@naver.com
    # Add push credentials later in Environment, then save and deploy.
    # FIREBASE_ANDROID_CONFIG_JSON, FCM_SERVICE_ACCOUNT_JSON
    # APNS_TEAM_ID, APNS_KEY_ID, APNS_PRIVATE_KEY
    # Optional separate sandbox key: APNS_DEV_KEY_ID, APNS_DEV_PRIVATE_KEY
